<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>芙宁娜 · 桌面宠物</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* 桌面宠物：背景完全透明，仅保留模型本身 */
            background: transparent;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* 对话输出框：显示在桌宠头顶上方（位置由 placeChatUI 按模型头部动态计算，
           left 水平居中、bottom 从窗口底部向上量），Liquid Glass 毛玻璃质感，
           闲置约 3 秒无鼠标/键盘交互自动淡出 */
        #bubble {
            position: fixed;
            bottom: 200px; /* 兜底值，实际由 JS 动态设置 */
            /* ===== v2.0 Round2 方向E：长文布局加固（限宽限高、自动滚动、自适应断字） ===== */
            max-width: min(360px, calc(100vw - 24px));
            /* 长文压缩到约 280px（兼顾小屏），超出部分用滑条滚动查看 */
            max-height: min(34vh, 280px);
            overflow-y: hidden;
            overflow-x: hidden;
            /* 中英文/URL/长标点都不溢出，允许长行按任意位置换行 */
            word-break: break-word;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
            padding: 14px 16px;
            font-size: 14px;
            line-height: 1.65;
            color: rgba(255, 255, 255, 0.95);
            text-align: left;
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            border-radius: 16px;
            background: linear-gradient(150deg, rgba(55, 65, 88, 0.42), rgba(24, 32, 46, 0.34));
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.28);
            box-shadow: 0 12px 34px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.22);
            opacity: 0;
            transform: translateX(-50%) translateY(8px);
            transition: opacity 0.35s cubic-bezier(0.22, 1, 0.36, 1), transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
            z-index: 10;
        }
        #bubble.scroll {
            overflow-y: auto;
        }
        /* ===== v2.0 Round2 方向E：细滚动条美化（不抢视线，长文可上下滚动） ===== */
        #bubble::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        #bubble::-webkit-scrollbar-track {
            background: transparent;
        }
        #bubble::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.22);
            border-radius: 3px;
        }
        #bubble::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.36);
        }
        #bubble::after {
            content: "";
            position: absolute;
            bottom: -8px;
            left: 24px;
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: rgba(40, 48, 66, 0.4) transparent transparent;
        }
        #bubble.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        /* 聊天输入框：点击桌宠后叠加显示在脚部区域（图层在模型之上），
           left 由 JS 按模型中心动态设置，translateX(-50%) 居中 */
        #chatBox {
            position: fixed;
            bottom: 24px;
            width: min(300px, calc(100vw - 24px));
            transform: translateX(-50%);
            display: none;
            z-index: 20;
        }
        #chatBox.show { display: block; }
        #chatInput {
            width: 100%;
            padding: 12px 16px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.96);
            caret-color: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 14px;
            outline: none;
            background: linear-gradient(150deg, rgba(55, 65, 88, 0.42), rgba(24, 32, 46, 0.34));
            backdrop-filter: blur(22px) saturate(180%);
            -webkit-backdrop-filter: blur(22px) saturate(180%);
            box-shadow: 0 12px 34px rgba(0, 0, 0, 0.26), inset 0 1px 0 rgba(255, 255, 255, 0.22);
            font-family: inherit;
        }
        #chatInput::placeholder { color: rgba(255, 255, 255, 0.55); }
        #chatInput:focus { border-color: rgba(255, 255, 255, 0.55); }
    </style>
    <!-- 关键：先把 pixi.js 裸模块名映射到本地自包含的 pixi.min.mjs -->
    <script type="importmap">
        {
            "imports": {
                "pixi.js": "./lib/pixi.min.mjs"
            }
        }
    </script>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="bubble"></div>
    <div id="chatBox"><input type="text" id="chatInput" placeholder="想对芙宁娜说点什么…（回车发送）" maxlength="300" /></div>

    <!-- 1. 先加载 Cubism5 Core（必须作为全局脚本，且必须在 pixi-live2d5 之前） -->
    <script src="./lib/live2dcubismcore.min.js"></script>

    <script type="module">
        // 把 PIXI 暴露到 window，插件自动通过 window.PIXI.Ticker 更新模型
        import * as PIXI from "pixi.js";
        import { Live2DModel, config } from "./lib/pixi-live2d5.es.js";

        window.PIXI = PIXI;

        // 指向本目录下的 GLSL shader
        config.cubism5ShaderPath = "./models/芙宁娜/shaders/";
        config.logLevel = "warning";
        // 静默 Cubism SDK 内部日志（含蒙版超限等无关紧要的输出）
        config.cubism5 = { logLevel: 5 };

        (async function () {
            try {
                // 先读取配置：输出分辨率（renderScale）需要在创建渲染器之前确定
                let cfg = { modelWidth: 420, modelHeight: 620, physicsStrength: 1.0, renderScale: 1, idleFps: 15, activeFps: 60, muted: false, opacity: 1.0, volumeSense: true };
                try {
                    const r = await fetch("/api/settings");
                    cfg = await r.json();
                } catch (e) {
                    console.warn("[模型] 读取配置失败，使用默认值", e && e.message);
                }

                const app = new PIXI.Application();

                await app.init({
                    canvas: document.getElementById("canvas"),
                    resizeTo: window,
                    preference: "webgl",
                    preferWebGLVersion: 2,
                    backgroundAlpha: 0,
                    antialias: true,
                    autoDensity: true,
                    // ===== v2.0 修复：preserveDrawingBuffer 必须 true，否则 gl.readPixels
                    // 在渲染帧外（如 pointerdown 事件回调中）读到的是已清除的空缓冲（全零），
                    // 导致 pixelHit 永远返回 false → 点击模型无任何响应 =====
                    preserveDrawingBuffer: true,
                    // 输出分辨率 = 设备像素比 × 用户设定的清晰度倍率（renderScale 1×~2×）
                    resolution: Math.min(window.devicePixelRatio || 1, 2) * (Number(cfg.renderScale) || 1),
                });

                // ---------- v2.0：稳定目标帧率（不再闲置降帧） ----------
                const TARGET_FPS = Math.max(15, Math.min(120, Number(cfg.targetFps) || 60));
                try {
                    if (app.ticker && typeof app.ticker.maxFPS === "number") {
                        app.ticker.maxFPS = TARGET_FPS;
                    } else if (PIXI.Ticker && PIXI.Ticker.shared && typeof PIXI.Ticker.shared.maxFPS === "number") {
                        PIXI.Ticker.shared.maxFPS = TARGET_FPS;
                    }
                    console.info(`[帧率] 稳定 ${TARGET_FPS}fps`);
                } catch (e) { console.warn("[帧率] 设置失败", e && e.message); }

                // ===== v2.0 Round2 修复：把 lastInteractionTime / lastProactiveTime 声明提前 =====
                let lastInteractionTime = Date.now(); // 最近一次用户互动时间
                let lastProactiveTime = 0;            // 最近一次主动搭话时间
                function markInteraction() {
                    lastInteractionTime = Date.now(); // 刷新全局闲置计时
                }

                // ===== v2.0 Round3：根据 config.modelPath 动态加载模型 =====
                const modelPath = String(cfg.modelPath || "models/芙宁娜");
                // 先从 /api/models 获取当前模型的 model3.json 文件名
                let model3File = "model3.json";
                try {
                    const r = await fetch("/api/models");
                    const d = await r.json();
                    if (d.ok && d.models) {
                        const found = d.models.find(m => m.path === modelPath);
                        if (found && found.modelFile) model3File = found.modelFile;
                    }
                } catch {}
                const model3Url = `./${modelPath}/${model3File}`;
                console.info(`[模型] 加载路径: ${model3Url}`);
                const model = await Live2DModel.from(model3Url);

                app.stage.addChild(model);

                // ---------- v2.0 功能4：模型整体透明度（设置面板可调，范围 0.1~1.0） ----------
                try {
                    const op = Math.min(1.0, Math.max(0.1, Number(cfg.opacity) || 1.0));
                    model.alpha = op;
                    console.info(`[透明度] 模型 alpha =`, op);
                } catch (e) { console.warn("[透明度] 设置失败", e && e.message); }

                // 隐藏「仅供娱乐」胸牌：
                // 通过 Part 层级定位「牌子+表情.psd」(Part186) 与「牌子」(Part187) 两个部件，
                // 把它们名下的所有 ArtMesh 每帧强制写透明度 0。
                // 注意：透明度必须在模型更新(model.update)之后、渲染之前覆盖才有效，
                // 这里挂在 app.ticker 上，PIXI 会在同帧渲染前执行，故不会被模型更新覆盖。
                const coreModel = model.internalModel.coreModel; // CubismModel 实例
                const BADGE_PARTS = ["Part186", "Part187"];
                const badgePartIdx = new Set();
                for (let p = 0; p < coreModel.getPartCount(); p++) {
                    const id = coreModel.getPartId(p).getString();
                    if (BADGE_PARTS.includes(id)) badgePartIdx.add(p);
                }
                const HIDE_DRAWABLES = [];
                for (let d = 0; d < coreModel.getDrawableCount(); d++) {
                    if (badgePartIdx.has(coreModel.getDrawableParentPartIndex(d))) {
                        HIDE_DRAWABLES.push(d);
                    }
                }
                console.info("[胸牌] 待隐藏 ArtMesh:", HIDE_DRAWABLES.join(","));
                // 关键：Live2D 模型的更新与绘制都在 render() 内顺序执行（model.update→draw），
                // 若把覆盖挂在 PIXI ticker 上，会被 render 里的 model.update() 重算透明度覆盖。
                // 因此这里包装 internalModel.update：模型更新一完成、绘制之前立即强制隐藏胸牌。
                const internalModel = model.internalModel;
                const _origInternalUpdate = internalModel.update.bind(internalModel);
                let lastModelNow = 0;  // 最近一帧 internalModel.update 的 now（毫秒），供摸头动画计时
                let headPat = null;    // 摸头动画状态：{ start, duration, amplitude, bounces }
                function startHeadPat() {
                    headPat = { start: lastModelNow, duration: 1.2, amplitude: 0.18, bounces: 6 };
                }
                internalModel.update = (dt, now) => {
                    lastModelNow = now;
                    _origInternalUpdate(dt, now);
                    const op = coreModel.getModel().drawables.opacities;
                    for (const d of HIDE_DRAWABLES) op[d] = 0;
                    // 摸头动画：以「点头 + 轻微歪头」的衰减正弦模拟被摸头时低头回弹
                    // 在模型更新完成后直接写参数，避免被模型自身的更新覆盖。
                    if (headPat) {
                        const t = (now - headPat.start) / 1000;
                        if (t >= headPat.duration) {
                            headPat = null;
                            coreModel.setParameterValueById("ParamAngleZ", 0, 1);
                            coreModel.setParameterValueById("ParamAngleX", 0, 1);
                        } else {
                            const p = t / headPat.duration;
                            const decay = Math.pow(1 - p, 1.6);
                            const ang = Math.sin(p * Math.PI * headPat.bounces) * headPat.amplitude * decay;
                            coreModel.setParameterValueById("ParamAngleZ", ang, 1);
                            coreModel.setParameterValueById("ParamAngleX", ang * 0.5, 1);
                        }
                    }
                };

                // 应用物理强度：让待机时衣服/头发飘动更明显。
                // 三重放大：① 输出混合权重 weight（封顶100=全量输出，解决原权重<100时效果被削减的问题）；
                // ② 输出缩放 scale（直接线性放大物理摆动幅度，最直观有效）；
                // ③ 粒子加速度 acceleration（增强布料对外部输入的响应，让飘动更活泼）。
                try {
                    const ph = model.internalModel.physics;
                    if (ph && ph._physicsRig && ph._physicsRig.outputs) {
                        const s = Number(cfg.physicsStrength) || 1;
                        if (s !== 1) {
                            const rig = ph._physicsRig;
                            for (const o of rig.outputs) {
                                o.weight = Math.min(100, o.weight * s);
                                if (o.translationScale) {
                                    o.translationScale.x *= s;
                                    o.translationScale.y *= s;
                                }
                                o.angleScale *= s;
                            }
                            if (rig.particles) {
                                for (const p of rig.particles) p.acceleration *= s;
                            }
                        }
                        console.info("[物理] 强度 =", s);
                    } else {
                        console.warn("[物理] 未找到物理引擎实例");
                    }
                } catch (e) { console.warn("[物理] 调整失败", e && e.message); }

                // 记录模型原始尺寸（缩放前），按配置的显示宽高设置缩放。
                // 注意：用模型「内容」的实际包围盒（getLocalBounds）定位，而不是整张画布，
                // 否则画布留白会让模型（尤其脚部）被窗口边缘裁切，导致显示不全。
                const origW = model.width;
                const origH = model.height;
                // ===== v2.0 Round4：每角色独立布局配置 =====
                // 芙宁娜：独立缩放填满窗口（原本效果良好，等比缩放反而变窄）
                // 胡桃/纳西妲/甘雨：等比缩放（防止拉伸变形）
                const MODEL_LAYOUTS = {
                    "model":          { uniformScale: false, width: 420, height: 620, rightMargin: 28, bottomMargin: 36 },
                    "models/芙宁娜":  { uniformScale: false, width: 420, height: 620, rightMargin: 28, bottomMargin: 36 },
                    "models/hutao":   { uniformScale: true,  width: 380, height: 620, rightMargin: 20, bottomMargin: 36 },
                    "models/nahida":  { uniformScale: true,  width: 420, height: 620, rightMargin: 28, bottomMargin: 36 },
                    "models/ganyu":   { uniformScale: true,  width: 420, height: 620, rightMargin: 28, bottomMargin: 36 },
                    "models/barbara": { uniformScale: true,  width: 420, height: 620, rightMargin: 28, bottomMargin: 36 },
                    "models/lauma":   { uniformScale: true,  width: 420, height: 620, rightMargin: 28, bottomMargin: 36 },
                    "models/nefer":   { uniformScale: true,  width: 420, height: 620, rightMargin: 28, bottomMargin: 36 },
                    "models/skirk":   { uniformScale: true,  width: 420, height: 620, rightMargin: 28, bottomMargin: 36 },
                    // 八重神子：半身模型，底部贴紧 Dock（bottomMargin 0）不露空白，等比缩放防变形
                    "models/八重神子": { uniformScale: true, width: 460, height: 680, rightMargin: 28, bottomMargin: 0 },
                };
                const layoutCfg = MODEL_LAYOUTS[modelPath] || MODEL_LAYOUTS["model"];
                // v2.0.3 修复「整体缩放」失效：之前只改窗口尺寸、模型布局用固定 100% 尺寸，
                // 八重神子等角色缩放滑块完全无效。现在把布局尺寸乘以 scalePercent 再渲染，窗口同步缩放。
                const scalePct = (Number(cfg.scalePercent) || 100) / 100;
                const L = Object.assign({}, layoutCfg, { width: layoutCfg.width * scalePct, height: layoutCfg.height * scalePct });
                function layout() {
                    try {
                        const lb = model.getLocalBounds();
                        if (lb.width > 0 && lb.height > 0) {
                            const sx = L.width / lb.width;
                            const sy = L.height / lb.height;
                            let scaleX, scaleY;
                            if (layoutCfg.uniformScale) {
                                // 等比缩放：取较小值，保持模型原始宽高比
                                const us = Math.min(sx, sy);
                                scaleX = us; scaleY = us;
                            } else {
                                // 独立缩放：各轴独立，填满目标宽高
                                scaleX = sx; scaleY = sy;
                            }
                            model.scale.set(scaleX, scaleY);
                            // getLocalBounds() 只计入 localTransform 的缩放，漏掉了它的平移量
                            const lt = model.internalModel.localTransform;
                            const lx = lt.tx || 0, ly = lt.ty || 0;
                            model.x = window.innerWidth - L.rightMargin - (lb.x + lb.width) * scaleX - lx * scaleX;
                            model.y = window.innerHeight - L.bottomMargin - (lb.y + lb.height) * scaleY - ly * scaleY;
                            placeChatUI();
                            return;
                        }
                    } catch {}
                    // 回退
                    const sxFb = L.width / origW;
                    const syFb = L.height / origH;
                    if (layoutCfg.uniformScale) {
                        const usFb = Math.min(sxFb, syFb);
                        model.scale.set(usFb, usFb);
                    } else {
                        model.scale.set(sxFb, syFb);
                    }
                    model.x = window.innerWidth - model.width;
                    model.y = window.innerHeight - model.height;
                }
                layout();
                window.addEventListener("resize", layout);

                // 屏幕信息缓存：工作区（不含 Dock/菜单栏）+ 窗口位置/大小，
                // 用于把聊天输入框约束在屏幕内、避开 Dock。
                let screenInfo = null;
                async function refreshScreenInfo() {
                    try {
                        const r = await fetch("/api/screen");
                        const d = await r.json();
                        if (d && d.ok) screenInfo = d;
                    } catch {}
                }
                refreshScreenInfo();

                // 聊天输入框与输出气泡的水平居中定位：都对齐模型中心；
                // 输出气泡（说话内容）放在头顶上方，聊天输入框放在脚部区域。
                // 两者都会根据屏幕工作区（已扣除 Dock/菜单栏）自动夹紧位置：
                // 桌宠在屏幕最右下角、或窗口被拖到边缘时，输入框/气泡自动左移、上移，
                // 不超出屏幕、不被 Dock 挡住。
                function placeChatUI() {
                    try {
                        const box = document.getElementById("chatBox");
                        const bub = document.getElementById("bubble");
                        const lb = model.getLocalBounds();
                        const lt = model.internalModel.localTransform;
                        // 模型中心（窗口内 x）与模型内容顶部（窗口内 y）
                        const cx = model.x + (lb.x + (lt.tx || 0) + lb.width / 2) * model.scale.x;
                        const top = model.y + (lb.y + (lt.ty || 0)) * model.scale.y;
                        // 窗口位置/尺寸 + 屏幕工作区（不含 Dock/菜单栏）。
                        // screenInfo 取不到时退回窗口坐标，不影响正常使用。
                        const wx = (screenInfo && screenInfo.windowPos && screenInfo.windowPos.x) || 0;
                        const wy = (screenInfo && screenInfo.windowPos && screenInfo.windowPos.y) || 0;
                        const ww = (screenInfo && screenInfo.windowSize && screenInfo.windowSize[0]) || window.innerWidth;
                        const wh = (screenInfo && screenInfo.windowSize && screenInfo.windowSize[1]) || window.innerHeight;
                        const wa = (screenInfo && screenInfo.workArea) || { x: 0, y: 0, width: ww, height: wh };
                        const M = 10; // 屏幕边缘留白
                        // 水平：中心点夹在工作区左右内；垂直：底部夹在工作区上下内
                        const clampX = (centerScreenX, w) => {
                            const min = wa.x + M + w / 2;
                            const max = wa.x + wa.width - M - w / 2;
                            return Math.min(Math.max(centerScreenX, min), Math.max(min, max));
                        };
                        const clampY = (bottomScreenY, h) => {
                            const min = wa.y + M + h;
                            const max = wa.y + wa.height - M;
                            return Math.min(Math.max(bottomScreenY, min), Math.max(min, max));
                        };
                        if (box) {
                            const bw = box.offsetWidth || 300;
                            const bh = box.offsetHeight || 45;
                            // 输入框中心默认对齐模型中心，底部默认距窗口底部 24px（脚部区域）
                            const centerX = clampX(wx + cx, bw);
                            const bottomY = clampY(wy + wh - 24, bh);
                            box.style.left = Math.round(centerX - wx) + "px";
                            box.style.bottom = Math.round(wy + wh - bottomY) + "px";
                        }
                        if (bub) {
                            const bw = bub.offsetWidth || 200;
                            const bh = bub.offsetHeight || 60;
                            // 气泡中心对齐模型中心，底部 = 头顶上方 10px
                            const centerX = clampX(wx + cx, bw);
                            const bottomY = clampY(wy + (top - 10), bh);
                            bub.style.left = Math.round(centerX - wx) + "px";
                            bub.style.bottom = Math.round(wy + wh - bottomY) + "px";
                        }
                    } catch {}
                }

                // 安全兜底：待机走路/物理摆动中内容一旦越出窗口边缘就整体平移回来，
                // 确保全身（尤其脚部）永远完整显示。只平移不缩放，避免画面跳动。
                app.ticker.add(() => {
                    try {
                        const lb = model.getLocalBounds();
                        if (lb.width <= 0) return;
                        const lt = model.internalModel.localTransform;
                        const lx = lt.tx || 0, ly = lt.ty || 0;
                        const left = model.x + (lb.x + lx) * model.scale.x;
                        const right = model.x + (lb.x + lx + lb.width) * model.scale.x;
                        const top = model.y + (lb.y + ly) * model.scale.y;
                        const bottom = model.y + (lb.y + ly + lb.height) * model.scale.y;
                        if (bottom > window.innerHeight - 2) model.y -= bottom - (window.innerHeight - 2);
                        if (right > window.innerWidth - 2) model.x -= right - (window.innerWidth - 2);
                        if (top < 2) model.y += 2 - top;
                        if (left < 2) model.x += 2 - left;
                    } catch {}
                });

                // 视线/头部跟随鼠标（focus 方法自带插值）。
                // 桌面宠物窗口是鼠标穿透的，主进程会按窗口内坐标推送「全局光标位置」，
                // 窗口内 pointermove 作为兜底。
                // 额外逻辑：鼠标持续 5 秒未移动时，桌宠自动正视前方；鼠标再次移动即恢复跟随。
                let lastCursor = null;   // 最近一次有效光标位置
                let lastMoveTime = 0;    // 最近一次光标「移动」时间
                let isIdle = false;      // 是否处于「正视」空闲态
                let hoverState = false;  // 鼠标是否位于模型本体上（决定点击穿透开关）

                // 判定鼠标是否在可交互区域（模型几何范围 或 可见的聊天输入框）内，
                // 决定是否关闭点击穿透。核心用「模型内容包围盒 getBounds()」做几何命中：
                // 纯计算、零 GPU 回读，稳定可靠，鼠标在模型上时窗口不穿透、可点击互动，
                // 在模型外空白处保持穿透、不挡鼠标。
                // （注意：本模型未带名为 HitArea 的部件，model.hitTest() 恒为空，
                //   因此这里以 getBounds() 为主，而非依赖 HitArea。）
                // ---------- v2.0 新增：像素级命中检测（只对 Live2D 人物「真实像素」响应，透明区域穿透） ----------
                // 原理：从 PIXI WebGL 渲染器的当前帧缓冲读取 (x,y) 点 1×1 像素的 alpha 值，
                // 只有真正「不透明」（抗锯齿边缘 alpha≥阈值）的像素才算命中。
                // 从而实现「点到背景透明空白 = 完全穿透，点击人物本体才触发交互」。
                const PIXEL_ALPHA_THRESHOLD = 10; // 0~255：≈4% 以上不透明度即认为命中（包含抗锯齿边缘）
                let _pixelCache = { x: -1, y: -1, hit: false, t: 0 };
                let _pixelDebugCount = 0; // 调试计数器（前 5 次打印 alpha 值）
                function pixelHit(clientX, clientY) {
                    try {
                        const view = app.view; // HTMLCanvasElement（被渲染器绘制了模型）
                        if (!view || !view.getContext) return false;
                        // 1) 先求 canvas 在屏幕上的位置：clientX,Y 是屏幕相对，需换算成 canvas 内的 CSS 像素
                        const rect = view.getBoundingClientRect();
                        const cssX = clientX - rect.left;
                        const cssY = clientY - rect.top;
                        if (cssX < 0 || cssY < 0 || cssX >= rect.width || cssY >= rect.height) return false;
                        // 2) CSS 像素 × resolution（DPR × renderScale）= framebuffer 设备像素
                        const reso = Number(app.renderer && app.renderer.resolution) || 1;
                        const devX = Math.floor(cssX * reso);
                        // WebGL 帧缓冲 y 轴左下起，Canvas/DOM y 轴左上起，故翻转
                        const fbH = Math.floor(rect.height * reso);
                        const fbW = Math.floor(rect.width * reso);
                        const glY = Math.max(0, Math.min(fbH - 1, fbH - 1 - Math.floor(cssY * reso)));
                        if (devX < 0 || devX >= fbW) return false;
                        const fb = app.renderer && app.renderer.gl;
                        if (!fb) return false;
                        // 缓存同一像素的结果（同一帧内多次查询只需读一次）
                        const now = Date.now();
                        if (_pixelCache.x === devX && _pixelCache.y === glY && now - _pixelCache.t < 16) return _pixelCache.hit;
                        // v2.0：preserveDrawingBuffer=true 保留了上一帧的绘制缓冲，
                        // 直接 readPixels 即可读取最新渲染结果。
                        // 不做强制渲染（PIXI v8 中 render() 会写入内部 render target 而非 canvas，
                        // 导致 readPixels 读到错误的缓冲区内容）
                        const pixels = new Uint8Array(4);
                        fb.readPixels(devX, glY, 1, 1, fb.RGBA, fb.UNSIGNED_BYTE, pixels);
                        const alpha = pixels[3];
                        const hit = alpha >= PIXEL_ALPHA_THRESHOLD;
                        _pixelCache = { x: devX, y: glY, hit, t: now };
                        // ===== 调试日志：前 5 次读取打印 alpha 值，方便确认 readPixels 生效 =====
                        if (_pixelDebugCount < 5) {
                            _pixelDebugCount++;
                            console.info(`[像素命中] alpha=${alpha} hit=${hit} devX=${devX} glY=${glY} fbW=${fbW} fbH=${fbH}`);
                        }
                        return hit;
                    } catch (e) {
                        // 读像素失败（非 WebGL / renderer 未就绪）→ 保守返回 true，避免功能被锁死
                        console.warn("[像素命中] 读取失败，兜底：", e && e.message);
                        return true;
                    }
                }
                function isOnModel(x, y) {
                    // 先判定 DOM 层：聊天输入框可见时整个输入框区域算命中（以便正常输入文字）
                    const cb = document.getElementById("chatBox");

                        if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return true;
                    }
                    // 一级粗筛（计算级，零开销）：
                    //   ① 若模型定义了 HitArea 部件 → 优先用库内置命中（纯数学，精确）
                    //   ② 否则用模型内容包围盒 getBounds() 做快速排除
                    let coarseOk = false;
                    try {
                        const internal = model.internalModel;
                        if (internal && internal.hitAreas && Object.keys(internal.hitAreas).length > 0) {
                            if (model.hitTest(x, y).length > 0) coarseOk = true;
                        }
                    } catch {}
                    if (!coarseOk) {
                        try {
                            const b = model.getBounds();
                            if (x >= b.x && x <= b.x + b.width && y >= b.y && y <= b.y + b.height) coarseOk = true;
                        } catch {}
                    }

                    // 包围盒内的大量透明背景会在这里被剔除，从而实现「点空白 = 穿透」
                    return pixelHit(x, y);

                function handleHover(x, y) {

                        // 只有确认用户真的在「悬停逗宠物」才触发情绪话（省 token、不干扰点击/双击）
                        if (hit) {
                            if (moodPendingTimer) clearTimeout(moodPendingTimer);
                            moodPendingTimer = setTimeout(() => {
                                moodPendingTimer = null;

                        } else if (moodPendingTimer) {

                            moodPendingTimer = null;
                        }
                    }
                }

                });

                // ---------- 对话输出框 ----------
                // Liquid Glass 输出框：有新回复时显示，打字机逐字打出，打完后约 3.5 秒自动淡出。
                // 支持简单表情标记（[开心]→😊）与情绪标签（（小脸红）→自动切换模型表情，标签不显示在正文里）。
                // 回答「只说一次」：鼠标移动/悬停都「不会把旧内容重新弹出来」。
                const OUTPUT_HIDE_DELAY = 3500;
                let outputTimer = null;
                let typewriterTimer = null;
                // 简单表情标记：方括号里的文字 → emoji
                const EMOJI_MAP = {
                    "[开心]": "😊", "[哭]": "😭", "[生气]": "😠", "[汗]": "😅", "[星星]": "✨",
                    "[爱心]": "💙", "[棒]": "👍", "[惊]": "😮", "[无语]": "😑", "[笑]": "😄",
                };
                // 情绪名 → 模型表情映射表
                // v2.0 Round3：先尝试直接用情绪名作为表情名（适配胡桃/纳西妲的英文名），
                // 再尝试中文关键词映射（适配芙宁娜的中文表情名）
                const EMOTION_EXPR = {
                    // 芙宁娜：中文情绪词 → 中文表情名
                    开心: "小脸红", 高兴: "小脸红", 害羞: "小脸红", 脸红: "小脸红", 羞涩: "小脸红",
                    娇羞: "小脸红", 羞: "小脸红", 不好意思: "小脸红",
                    哭: "哭", 难过: "哭", 伤心: "哭", 委屈: "哭", 担忧: "哭", 担心: "哭", 心疼: "哭",
                    生气: "生气", 愤怒: "生气", 恼: "生气",
                    汗: "汗", 尴尬: "汗", 无语: "汗", 冷汗: "汗", 无奈: "汗", 累: "汗",
                    星星: "星星", 惊喜: "星星", 惊艳: "星星",
                    猫猫嘴: "猫猫嘴", 傲娇: "猫猫嘴", 得意: "猫猫嘴",
                    托脸: "托脸", 卖萌: "托脸", 撒娇: "托脸",
                    大聪明: "大聪明", 捂嘴: "捂嘴", 偷笑: "捂嘴",
                    帽子: "帽子", 拿蛋糕: "拿蛋糕", 吃: "拿蛋糕", 喝饮料: "喝饮料", 喝: "喝饮料",
                    拿勺子: "拿勺子", 呆毛电风扇: "呆毛电风扇", 鱼鱼: "鱼鱼",
                    // 胡桃/纳西妲：中文情绪词 → 英文表情名
                    happy: "SmileLock", shy: "SadLock", sad: "SadLock", angry: "Angry",
                    "开心2": "Happy1", "害羞2": "shy_normal",
                };
                function emojiMark(text) {
                    let t = String(text);
                    for (const k in EMOJI_MAP) t = t.split(k).join(EMOJI_MAP[k]);
                    return t;
                }
                // 提取开头情绪标签（（情绪名）或 (情绪名)），返回 { emotion, body }
                function parseEmotionTag(text) {
                    const t = String(text);
                    const m = t.match(/^\s*[（(]([^）)]+)[）)]\s*/);
                    if (!m) return { emotion: null, body: t };
                    const expr = EMOTION_EXPR[m[1].trim()] || null;
                    // 只保留第一段正式内容：若正文后面还跟着第二个（情绪名）标签则截断
                    let body = t.slice(m[0].length).trim();
                    const nxt = body.match(/\n[（(][^）)]+[）)]/);
                    if (nxt) body = body.slice(0, nxt.index).trim();
                    return { emotion: expr, body };
                }
                // 播放一个表情，约 4 秒后自动恢复默认表情
                let expressionTimer = null;
                function playExpression(name) {
                    try {
                        // v2.0 Round3：先尝试直接用名称作为表情名（胡桃/纳西妲的英文表情名直接匹配）
                        // 如果直接匹配失败，再尝试 EMOTION_EXPR 映射表（中文情绪词 → 表情名）
                        const exprName = EMOTION_EXPR[name] || name;
                        model.expression(exprName).then(() => {
                            if (expressionTimer) clearTimeout(expressionTimer);
                            expressionTimer = setTimeout(() => {
                                try { model.internalModel.motionManager.expressionManager.resetExpression(); } catch {}
                            }, 4000);
                        }).catch(() => {
                            // 如果映射后的名字也不存在，尝试原始名字
                            if (exprName !== name) {
                                try { model.expression(name); } catch {}
                            }
                        });
                    } catch {}
                }
                function showBubble(text) {
                    const el = document.getElementById("bubble");
                    if (!el) return;
                    // ----- v2.0 功能3：静音开关（muted=true 时跳过所有气泡显示，仍允许切换表情以保留情绪动画） -----
                    const { emotion, body } = parseEmotionTag(text);
                    if (emotion) playExpression(emotion);
                    if (cfg.muted) return; // 静音：不显示文字气泡
                    const display = emojiMark(body);
                    if (typewriterTimer) clearInterval(typewriterTimer);
                    el.classList.add("show");
                    el.classList.remove("scroll"); // 短文默认不显示滚动条
                    el.textContent = "";
                    el.scrollTop = 0; // ===== v2.0 Round2 方向E：长文打字机开始前，先滚回顶部 =====
                    placeChatUI(); // 内容变化后按屏幕工作区重新夹紧气泡位置
                    // 打字机逐字显示；短/中/长三档自适应加速，避免长文看完太久
                    // 1) ≤50 字：1 字 / 26ms（日常闲聊，20 字左右刚好）
                    // 2) 51~100 字：2 字 / 8ms（中等回答）
                    // 3) >100 字：3 字 / 4ms（复杂问题/长段落，快速出字）
                    const chars = [...display];
                    let i = 0;
                    let tick = 0;
                    const len = display.length;

                    if (len > 100) { step = 3; delay = 4; }
                    else if (len > 50) { step = 2; delay = 8; }

                        // 防止内容高度增大后超出屏幕上边界导致顶出画面 =====
                        tick++;

                            placeChatUI();

                            if (el.scrollHeight > el.clientHeight + 4) el.classList.add("scroll");

                // ---------- 悬停情绪话 ----------

                const MOOD_COOLDOWN = 45 * 1000;
                // v2.0.x：悬停意图确认窗口 —— 鼠标移上模型不立即说话，先等 500ms；

                let moodPendingTimer = null;
                let lastMoodTime = 0;
                async function maybeSpeakMoodLine() {

                }

                // ---------- 点击部位差异化反馈 ----------
                // 判定策略：站立角色按「画布纵向比例」切分为 头/胸/腰/私处/腿/脚 六个纵向带，
                // 再叠加「手部」特判（点中手/衣袖 → 摊手）。不用单个部件的包围盒，
                // 避免「点身体却命中头部」的误判。分界由各类部位的实际纵向范围计算。
                let partNameById = {};         // 部件 Id → 部件名
                let canvasH = 1;               // 模型画布像素高度
                let handDrawables = [];        // 手/衣袖 部件的 ArtMesh 索引

                let band = { headBottom: 0, chestBottom: 0, waistBottom: 0, legTop: 0, footTop: 0 };
                const HAND_KW = /手|摊/; // 仅真实手部（黑手/白手/摊手），排除宽大「衣袖」以免侵占胸/腰判定
                const HEAD_KW = /头|脸|发|刘海|礼帽|呆毛|眼|眉|鼻|嘴|耳|圈眼|五官|表情组|wink|睫毛|眼球|眼眶|眼皮|脸红|泪|汗|亮晶晶|鱼鱼|鼓嘴|生气/;

                        if (cdiPath) {

                    }
                    try {
                        const internal = model.internalModel;
                        canvasH = internal.originalHeight || 1;
                        const cm = internal.coreModel;
                        // 固定纵向分界（占画布高度比例）：头/胸/腰/私处/腿/脚。
                        // 比例可在设置面板「部位点击判定」中自由调整，并保存到 config.json，
                        // 下次打开自动沿用。此处从 cfg.band 读取（默认 头25/胸34/腰45/私处55/脚60）。
                        const bcfg = (cfg && cfg.band) || {};
                        // ===== v2.0.1 八重神子（半身模型）专属分界：头/胸/腰集中在画布上半部，
                        // 全局 band（头25/胸34/腰45/私处55/脚60）是为全身模型设计的，直接套用会把
                        // 头部误判成「腿/脚」。半身模型下方是透明区（点击穿透），分界拉到 100% 也安全。
                        const HALF_BODY_BANDS = { headBottom: 35, chestBottom: 58, waistBottom: 80, legTop: 92, footTop: 100 };
                        const useBands = (modelPath === "models/八重神子") ? Object.assign({}, bcfg, HALF_BODY_BANDS) : bcfg;
                        band.headBottom = canvasH * ((useBands.headBottom ?? 25) / 100);  // 头：0-headBottom%
                        band.chestBottom = canvasH * ((useBands.chestBottom ?? 34) / 100); // 胸：headBottom-chestBottom%
                        band.waistBottom = canvasH * ((useBands.waistBottom ?? 45) / 100); // 腰：chestBottom-waistBottom%
                        band.legTop = canvasH * ((useBands.legTop ?? 55) / 100);       // 私处：waistBottom-legTop%
                        band.footTop = canvasH * ((useBands.footTop ?? 60) / 100);     // 腿：legTop-footTop%、脚：footTop%+
                        // 收集各类部件的实际纵向范围 [minY, maxY]，仅用于校准分界
                        const FACE_KW = /头|脸|五官|眼|眉|鼻|嘴|耳|圈眼|wink|睫毛|眼球|眼眶|眼皮|脸红|泪|汗|亮晶晶|表情组|鼓嘴|生气/;
                        const HAIR_KW = /发|刘海|呆毛|礼帽|帽子/;

                            ]);
                            return;
                        }
                        // 3.4 常见时段问候
                        if (TIME_GREET[slot]) {
                            speakLocal(TIME_GREET[slot]);
                            return;
                        }
                        // 3.5 应用分类搭话
                        speakLocal(APP_LINES[cat] || APP_LINES.other);
                    }
                }
                // 启动时先取一次系统信息，之后每 30 秒刷新并判断是否主动搭话；同时初始化好感度档位
                refreshSystemInfo();
                refreshAffection();
                setInterval(() => maybeProactive(), 30000);

                // ---------- v2.0 功能5：音量感知 → 简单情绪反馈 ----------
                // 每 15 秒读取一次音量：
                //  - 大音量（≥75%，正在听音乐/看电影）→ 欢快表情
                //  - 静音或极小音量（≤5%，正在专注工作）→ 安静陪伴表情
                //  - 其余状态不做情绪（避免反复打扰），仅切换表情（不弹气泡）
                // volumeSense 开关由用户控制，sysInfo.volumePercent = -1 表示未启用/读取失败
                let lastVolumeEmoTime = 0;
                const VOL_EMO_COOLDOWN = 45000; // 45秒，不频繁切换表情以免掩盖用户交互表情
                // v2.0 Round3：动态获取模型表情列表用于音量感知
                function getModelExpressions() {
                    try {
                        const em = model.internalModel.motionManager.expressionManager;
                        if (em && em.settings && em.settings.expressions) {
                            return em.settings.expressions.map(e => e.name || e.Name || "").filter(Boolean);
                        }
                    } catch {}
                    return [];
                }
                function pickExprByKeyword(keywords) {
                    const all = getModelExpressions();
                    for (const kw of keywords) {
                        const found = all.find(n => n.toLowerCase().includes(kw.toLowerCase()));
                        if (found) return found;
                    }
                    return all.length > 0 ? all[Math.floor(Math.random() * Math.min(3, all.length))] : null;
                }
                async function volumeSenseReaction() {
                    try {
                        await refreshSystemInfo();
                        const v = Number(sysInfo.volumePercent);
                        if (v < 0 || isNaN(v) || !cfg.volumeSense) return;
                        const now = Date.now();
                        if (now - lastVolumeEmoTime < VOL_EMO_COOLDOWN) return;
                        lastVolumeEmoTime = now;
                        if (v >= 75) {
                            // 大音量：欢快热情（优先找 happy/smile/星/猫 类表情）
                            const e = pickExprByKeyword(["happy", "smile", "星", "猫", "laugh", "wink"]) || "星星";
                            playExpression(e);
                            console.info(`[音量感知] 音量=${v}% → 表情「${e}」（热闹~）`);
                        } else if (v <= 5) {
                            // 静音/极小：安静陪伴（优先找 sad/shy/托/捂 类表情）
                            const e = pickExprByKeyword(["shy", "sad", "托", "捂", "half", "calm"]) || "托脸";
                            playExpression(e);
                            console.info(`[音量感知] 音量=${v}% → 表情「${e}」（静静陪伴）`);
                        }
                        // 中间音量不做改变，避免反复打断用户触发生效的表情
                    } catch {}
                }
                if (cfg.volumeSense) {
                    volumeSenseReaction();
                    setInterval(volumeSenseReaction, 15000);
                }

                // ---------- 待机随机小动作 ----------
                // v2.0.3 八重神子节奏：无语音动作每 30~60 秒一次；带语音动作每 3~5 分钟一次（两个定时器分开）
                // v2.0 Round3：动态从模型表情列表中选取闲置动作，不再硬编码芙宁娜表情名
                let idleActionTimer = null;
                let yaeVoiceTimer = null;
                function getIdleActions() {
                    const all = getModelExpressions();
                    if (all.length > 0) return all.slice(0, 6); // 取前6个表情做闲置动作
                    return ["小脸红", "猫猫嘴", "托脸", "星星", "大聪明", "捂嘴"]; // 芙宁娜兜底
                }
                let SPECIAL_MOTIONS_GROUP = "Special";
                function scheduleIdleAction() {
                    idleActionTimer = setTimeout(() => {
                        try {
                            if (isYae) {
                                // 八重神子：无语音动作（尾巴/头饰/归零/屑眼神）加权更多，30~60 秒一次，不打扰
                                const yaeSilent = ["Tap归零", "Tap尾巴", "Tap头饰", "Shake", "Tap归零", "Tap尾巴", "Tap头饰"];
                                model.motion(yaeSilent[Math.floor(Math.random() * yaeSilent.length)]).catch(() => {});
                            } else if (Math.random() < 0.4) {
                                // 随机播放特殊动作（播完动画管理器自动回到待机，不会一直循环）
                                model.motion(SPECIAL_MOTIONS_GROUP).catch(() => {
                                    // 模型没有 Special 组动画时，改用闲置表情
                                    const actions = getIdleActions();
                                    playRandomExpression(actions);
                                });
                            } else {
                                playRandomExpression(getIdleActions());
                            }
                        } catch {}
                        scheduleIdleAction();
                    }, 30000 + Math.random() * 30000); // 30~60 秒
                }
                // 八重神子语音（带 wav 的动作）：3~5 分钟一次，按时间段混入问候，几段语音轮流出现不再重复
                function scheduleYaeVoice() {
                    yaeVoiceTimer = setTimeout(() => {
                        try {
                            if (isYae) {
                                const hour = new Date().getHours();
                                const voiceGroups = ["Tap无聊", "Tap不变"];
                                if (hour >= 5 && hour < 11) voiceGroups.push("Tap早上好");
                                else if (hour >= 11 && hour < 18) voiceGroups.push("Tap中午好");
                                else voiceGroups.push("Tap晚上好");
                                model.motion(voiceGroups[Math.floor(Math.random() * voiceGroups.length)]).catch(() => {});
                            }
                        } catch {}
                        scheduleYaeVoice();
                    }, 180000 + Math.random() * 120000); // 3~5 分钟
                }
                scheduleIdleAction();
                scheduleYaeVoice();

                // ---------- 聊天：在输入框输入文字回车发送，回复显示在气泡里 ----------
                // v2.0 流式输出：逐字接收 SSE，打字机效果来自网络流本身，无等待感
                chatInputEl.addEventListener("keydown", async (e) => {
                    if (e.key === "Escape") { closeChat(); return; }
                    if (e.key !== "Enter") return;
                    lastInteractionTime = Date.now(); // 正在聊天，刷新闲置计时
                    const msg = chatInputEl.value.trim();
                    if (!msg) return;
                    chatInputEl.value = "";
                    // 立即显示气泡，逐字填充
                    const bubbleEl = document.getElementById("bubble");
                    if (bubbleEl) {
                        if (typewriterTimer) clearInterval(typewriterTimer);
                        bubbleEl.classList.add("show");
                        bubbleEl.classList.remove("scroll");
                        bubbleEl.textContent = "";
                        placeChatUI();
                    }
                    let streamText = "";
                    try {
                        const r = await fetch("/api/chat", {
                            method: "POST",
                            headers: { "Content-Type": "application/json", "Accept": "text/event-stream" },
                            body: JSON.stringify({ message: msg }),
                        });
                        const reader = r.body.getReader();
                        const decoder = new TextDecoder();
                        let buf = "";
                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;
                            buf += decoder.decode(value, { stream: true });
                            let idx;
                            while ((idx = buf.indexOf("\n\n")) >= 0) {
                                const event = buf.slice(0, idx);
                                buf = buf.slice(idx + 2);
                                for (const line of event.split("\n")) {
                                    const t = line.trim();
                                    if (!t.startsWith("data:")) continue;
                                    try {
                                        const d = JSON.parse(t.slice(5).trim());
                                        if (d.ok && d.chunk) {
                                            streamText += d.chunk;
                                            if (bubbleEl) {
                                                bubbleEl.textContent = streamText;
                                                placeChatUI();
                                                if (bubbleEl.scrollHeight > bubbleEl.clientHeight + 4) bubbleEl.classList.add("scroll");
                                            }
                                        }
                                        if (d.ok && d.done) {
                                            // 流结束：不替换气泡内容（streamText 已累积完整内容），
                                            // 仅用来触发后续逻辑（好感度等已在后端处理完毕）
                                            // 计算自动隐藏时间用 streamText 实际长度
                                        }
                                        if (!d.ok) {
                                            showBubble(`呜…${charName}这边出了点小状况，稍后再试试吧~`);
                                        }
                                    } catch {}
                                }
                            }
                        }
                        // 流结束后：设置自动隐藏定时器
                        if (bubbleEl && streamText) {
                            const len = streamText.length;
                            const extraMs = Math.min(8000, Math.max(0, len - 20) * 60);
                            if (outputTimer) clearTimeout(outputTimer);
                            outputTimer = setTimeout(() => bubbleEl.classList.remove("show"), OUTPUT_HIDE_DELAY + extraMs);
                        }
                    } catch (err) {
                        showBubble(`呜…联系不上${charName}了，稍后再试试吧~`);
                    }
                });

                // 光标移出桌宠窗口时，自动收起聊天输入框（不再遮挡桌面）
                if (window.pet && window.pet.onChatBlur) {
                    window.pet.onChatBlur(() => closeChat());
                }

                // ---------- 接收主进程推送的 AI 对话并显示气泡 ----------
                if (window.pet && window.pet.onSpeech) {
                    window.pet.onSpeech((text) => showBubble(text));
                }

                // v2.0 Round3：播放待机动画（仅当模型有 Idle 组动画时才播放，胡桃/纳西妲没有 motions 也能正常启动）
                // v2.0.2 八重神子：没有 Idle 组但有 Start（初见）组（带语音）→ 启动时播放，充分利用自带动画
                if (isYae) {
                    try { await model.motion("Start"); } catch {}
                } else {
                    try { await model.motion("Idle"); } catch {} // 无 Idle 动画时静默跳过
                }
            } catch (err) {
                console.error(err);
            }
        })();
    </script>
</body>
